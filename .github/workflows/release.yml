name: Auto Build

on:
  push:
    branches: [ "coop" ]
    tags: [ "v*.*.*" ]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'microsoft'

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Run build-dist.ps1 (Host)
      run: |
        .\build-dist.ps1
      shell: powershell

    - name: Rename Host Dist
      run: |
        Rename-Item -Path "dist" -NewName "dist-host"
      shell: powershell

    - name: Run build-dist.ps1 (Guest)
      run: |
        .\build-dist.ps1 -Guest
      shell: powershell

    - name: Rename Guest Dist
      run: |
        Rename-Item -Path "dist" -NewName "dist-guest"
      shell: powershell

    - name: Zip Release Artifacts
      run: |
        Compress-Archive -Path "dist-host\*" -DestinationPath "WitcherOnline-Host.zip"
        Compress-Archive -Path "dist-guest\*" -DestinationPath "WitcherOnline-Guest.zip"
      shell: powershell

    - name: Determine Release Info
      id: release_info
      run: |
        if ($env:GITHUB_REF -match "^refs/tags/(.*)") {
            $tag = $matches[1]
            echo "tag_name=$tag" >> $env:GITHUB_OUTPUT
            echo "release_name=Release $tag" >> $env:GITHUB_OUTPUT
            echo "prerelease=false" >> $env:GITHUB_OUTPUT
        } else {
            echo "tag_name=latest" >> $env:GITHUB_OUTPUT
            echo "release_name=Latest Build (Auto)" >> $env:GITHUB_OUTPUT
            echo "prerelease=true" >> $env:GITHUB_OUTPUT
        }
      shell: powershell

    - name: Update Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.release_info.outputs.tag_name }}
        name: ${{ steps.release_info.outputs.release_name }}
        prerelease: ${{ steps.release_info.outputs.prerelease == 'true' }}
        files: |
          WitcherOnline-Host.zip
          WitcherOnline-Guest.zip
